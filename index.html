<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sadique & Arshad Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: #f8fafc;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px 15px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            padding: 28px 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            border: 1px solid #f1f5f9;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #0f172a;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 14px;
            color: #64748b;
            margin-top: 4px;
            font-weight: 500;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .person {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 16px;
            transition: border-color 0.2s ease;
        }

        .person:focus-within {
            border-color: #6366f1;
        }

        .person-title {
            font-size: 15px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .person-title::before {
            content: '';
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #6366f1;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            font-weight: 600;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper span {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 10px 12px 10px 28px;
            font-size: 15px;
            font-weight: 600;
            color: #0f172a;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }

        button:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .result {
            display: none;
            margin-top: 24px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-title {
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 14px;
            text-align: center;
        }

        .row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            font-size: 14px;
            color: #475569;
            border-bottom: 1px dashed #e2e8f0;
        }

        .row:last-of-type {
            border-bottom: none;
        }

        .row strong {
            font-size: 15px;
            color: #0f172a;
        }

        .payment {
            margin-top: 16px;
            padding: 14px;
            background: #e0e7ff;
            color: #3730a3;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            border: 1px solid #c7d2fe;
        }

        .error {
            color: #ef4444;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
            font-weight: 500;
        }

        .footer {
            text-align: center;
            color: #94a3b8;
            font-size: 12px;
            margin-top: 20px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <h1>Money Calculator</h1>
        <div class="subtitle">Sadique & Arshad Profit Splitter</div>
    </div>

    <!-- Sadique -->
    <div class="person">
        <div class="person-title">Sadique</div>
        <div class="grid-2">
            <div class="form-group">
                <label>Total Amount</label>
                <div class="input-wrapper">
                    <span>₹</span>
                    <input type="number" id="sadiqueAmount" placeholder="0" min="0">
                </div>
            </div>
            <div class="form-group">
                <label>Received</label>
                <div class="input-wrapper">
                    <span>₹</span>
                    <input type="number" id="sadiqueReceived" placeholder="0" min="0">
                </div>
            </div>
        </div>
    </div>

    <!-- Arshad -->
    <div class="person">
        <div class="person-title">Arshad</div>
        <div class="grid-2">
            <div class="form-group">
                <label>Total Amount</label>
                <div class="input-wrapper">
                    <span>₹</span>
                    <input type="number" id="arshadAmount" placeholder="0" min="0">
                </div>
            </div>
            <div class="form-group">
                <label>Received</label>
                <div class="input-wrapper">
                    <span>₹</span>
                    <input type="number" id="arshadReceived" placeholder="0" min="0">
                </div>
            </div>
        </div>
    </div>

    <!-- Calculate Button -->
    <button onclick="calculate()">Calculate Settlement</button>

    <div id="error" class="error"></div>

    <!-- Result -->
    <div id="result" class="result">
        <div class="result-title">Summary</div>

        <div class="row">
            <span>Total Profit</span>
            <strong id="profit">₹0</strong>
        </div>
        <div class="row">
            <span>Sadique Share</span>
            <strong id="sadiqueFinal">₹0</strong>
        </div>
        <div class="row">
            <span>Arshad Share</span>
            <strong id="arshadFinal">₹0</strong>
        </div>

        <div id="payment" class="payment">
            No payment required
        </div>
    </div>

    <div class="footer">
        Sadique & Arshad Money Calculator
    </div>

</div>

<script>
function money(value) {
    return "₹" + value.toLocaleString("en-IN", {
        maximumFractionDigits: 2
    });
}

function calculate() {
    const sadiqueAmount = Number(document.getElementById("sadiqueAmount").value);
    const sadiqueReceived = Number(document.getElementById("sadiqueReceived").value);
    const arshadAmount = Number(document.getElementById("arshadAmount").value);
    const arshadReceived = Number(document.getElementById("arshadReceived").value);

    const error = document.getElementById("error");
    const result = document.getElementById("result");

    if (
        !Number.isFinite(sadiqueAmount) ||
        !Number.isFinite(sadiqueReceived) ||
        !Number.isFinite(arshadAmount) ||
        !Number.isFinite(arshadReceived) ||
        sadiqueAmount < 0 ||
        sadiqueReceived < 0 ||
        arshadAmount < 0 ||
        arshadReceived < 0
    ) {
        error.textContent = "Please enter valid amounts for all fields.";
        result.style.display = "none";
        return;
    }

    error.textContent = "";

    const totalAmount = sadiqueAmount + arshadAmount;
    const totalReceived = sadiqueReceived + arshadReceived;
    const profit = totalReceived - totalAmount;
    const share = profit / 2;

    const sadiqueFinal = sadiqueAmount + share;
    const arshadFinal = arshadAmount + share;

    document.getElementById("profit").textContent = money(profit);
    document.getElementById("sadiqueFinal").textContent = money(sadiqueFinal);
    document.getElementById("arshadFinal").textContent = money(arshadFinal);

    const payment = document.getElementById("payment");

    if (sadiqueFinal > sadiqueReceived) {
        const amount = sadiqueFinal - sadiqueReceived;
        payment.textContent = "Arshad pays Sadique: " + money(amount);
    } else if (arshadFinal > arshadReceived) {
        const amount = arshadFinal - arshadReceived;
        payment.textContent = "Sadique pays Arshad: " + money(amount);
    } else {
        payment.textContent = "No payment required";
    }

    result.style.display = "block";
}
</script>

</body>
</html>
